name: omnispatial_env

channels:
  - conda-forge
  - bioconda
  - pytorch
  - defaults

dependencies:
  - python=3.10
  - pytorch::pytorch
  - pytorch::torchvision
  - pytorch::cpuonly
  - scipy
  - numpy
  - statsmodels
  - scanpy
  - anndata
  - biopython
  - rdkit
  - cobra
  - pytest
  - pytest-cov
  - pip
  - pip:
    - torch-geometric
    - pertpy
    - scvi-tools