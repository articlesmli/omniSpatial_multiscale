name: OmniSpatial-MultiScale CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install System Dependencies (AutoDock Vina & GROMACS)
      run: |
        sudo apt-get update
        sudo apt-get install -y autodock-vina gromacs

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        # Install PyTorch CPU version for CI testing
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt
        pip install pytest

    - name: Run Architecture & Diffusion Unit Tests
      run: |
        export PYTHONPATH=.
        pytest tests/
