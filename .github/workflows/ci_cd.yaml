name: OmniSpatial-MultiScale CI/CD

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Conda Environment & Dependencies
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        miniconda-version: 'latest'
        python-version: '3.10'
        channels: conda-forge, bioconda, pytorch, defaults
        channel-priority: strict
        activate-environment: omnispatial_env
        environment-file: environment.yaml
        use-mamba: true

    - name: Run Unit Tests with Coverage
      shell: bash -l {0}
      run: |
        export PYTHONPATH=.
        pytest tests/ --cov=omniSpatial_multiscale --cov-report=term