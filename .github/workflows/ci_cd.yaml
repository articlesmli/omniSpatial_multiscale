name: OmniSpatial-MultiScale CI/CD

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Cache Pip Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install System Dependencies (AutoDock Vina & GROMACS)
      run: |
        sudo apt-get update
        sudo apt-get install -y autodock-vina gromacs

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        # Install PyTorch CPU version for CI testing to save bandwidth and runner time
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run Architecture & Diffusion Unit Tests with Coverage
      run: |
        export PYTHONPATH=.
        pytest tests/ --cov=omniSpatial_multiscale --cov-report=xml

    - name: Upload Coverage Report
      uses: codecov/codecov-action@v4
      with:
        token: ${{secrets.CODECOV_TOKEN}}
        fail_ci_if_error: false
